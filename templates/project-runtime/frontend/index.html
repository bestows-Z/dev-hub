<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>我的项目预览</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8f5ef; color: #20312d; font-family: system-ui, sans-serif; }
      main { max-width: 32rem; padding: 2rem; }
      h1 { font-size: clamp(2rem, 7vw, 4rem); margin-bottom: .5rem; }
      p { line-height: 1.8; }
    </style>
  </head>
  <body>
    <main>
      <h1>你好，这是我的项目。</h1>
      <p>将 frontend/ 与 backend/ 换成你的应用，保留约定的 Dockerfile 和目录结构即可。</p>
      <p id="message">正在联系后端…</p>
    </main>
    <script>
      fetch('backend/hello').then((response) => response.json()).then((data) => {
        document.querySelector('#message').textContent = data.message
      }).catch(() => { document.querySelector('#message').textContent = '后端暂时不可用' })
    </script>
  </body>
</html>
