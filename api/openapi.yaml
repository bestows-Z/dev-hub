openapi: 3.0.3

info:
  title: DevHub API
  description: |
    DevHub 个人开发者平台后端 API。

    ## 统一响应约定

    除真正的服务器内部异常外，HTTP Status 统一返回 200。

    客户端通过响应体中的 `code` 判断业务执行结果。

    - `code = 0`：成功
    - `code != 0`：业务失败
    - HTTP 500：服务器内部异常

  version: 0.2.0

servers:
  - url: http://localhost:8080
    description: 本地开发环境

tags:
  - name: System
    description: 系统基础接口

  - name: Auth
    description: 用户认证接口

  - name: Content
    description: 公开文章与友链

  - name: Store
    description: 商品和订单

  - name: Projects
    description: 公开项目

  - name: Admin
    description: 管理员内容与订单维护；先通过登录接口获取 Bearer Token

  - name: Assistant
    description: 基于已发布文章的问答；可选接入兼容 Chat Completions 的模型


paths:

  /api/v1/assistant/chat:
    post:
      tags: [Assistant]
      summary: 向文章助手提问
      description: 仅检索已发布文章。未配置模型时返回相关原文摘录，配置模型后根据摘录生成回答；始终附来源。单 IP 每分钟最多 20 次。
      operationId: assistantChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, minLength: 2, maxLength: 500, example: 数据库库存是怎么更新的？ }
      responses:
        "200":
          description: code 为 0 时成功；无结果时返回提示与空来源列表
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: success }
                  data:
                    type: object
                    required: [answer, sources]
                    properties:
                      answer: { type: string }
                      sources:
                        type: array
                        items:
                          type: object
                          required: [title, url]
                          properties:
                            title: { type: string }
                            url: { type: string, example: /articles/postgres-notes }

  /api/v1/admin/articles:
    get:
      tags: [Admin]
      summary: 管理员读取全部文章（含草稿）
      operationId: adminListArticles
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200": { $ref: "#/components/responses/AdminPageSuccess" }
    post:
      tags: [Admin]
      summary: 创建文章
      operationId: adminCreateArticle
      security: [{ BearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/ArticleInput" }
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }

  /api/v1/admin/articles/{id}:
    parameters:
      - { $ref: "#/components/parameters/AdminID" }
    put:
      tags: [Admin]
      summary: 完整更新文章
      operationId: adminUpdateArticle
      security: [{ BearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/ArticleInput" }
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }
    delete:
      tags: [Admin]
      summary: 删除文章
      operationId: adminDeleteArticle
      security: [{ BearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }

  /api/v1/admin/links:
    get:
      tags: [Admin]
      summary: 管理员读取全部友链
      operationId: adminListLinks
      security: [{ BearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }
    post:
      tags: [Admin]
      summary: 创建友链
      operationId: adminCreateLink
      security: [{ BearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/LinkInput" }
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }

  /api/v1/admin/links/{id}:
    parameters:
      - { $ref: "#/components/parameters/AdminID" }
    put:
      tags: [Admin]
      summary: 完整更新友链
      operationId: adminUpdateLink
      security: [{ BearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/LinkInput" }
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }
    delete:
      tags: [Admin]
      summary: 删除友链
      operationId: adminDeleteLink
      security: [{ BearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }

  /api/v1/admin/products:
    get:
      tags: [Admin]
      summary: 管理员读取全部商品
      operationId: adminListProducts
      security: [{ BearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminPageSuccess" }
    post:
      tags: [Admin]
      summary: 创建商品
      operationId: adminCreateProduct
      security: [{ BearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/ProductInput" }
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }

  /api/v1/admin/products/{id}:
    parameters:
      - { $ref: "#/components/parameters/AdminID" }
    put:
      tags: [Admin]
      summary: 完整更新商品
      operationId: adminUpdateProduct
      security: [{ BearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/ProductInput" }
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }
    delete:
      tags: [Admin]
      summary: 删除商品；有订单引用时不能删除
      operationId: adminDeleteProduct
      security: [{ BearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }

  /api/v1/admin/projects:
    get:
      tags: [Admin]
      summary: 管理员读取全部项目
      operationId: adminListProjects
      security: [{ BearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminPageSuccess" }
    post:
      tags: [Admin]
      summary: 创建项目
      operationId: adminCreateProject
      security: [{ BearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/ProjectInput" }
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }

  /api/v1/admin/projects/{id}:
    parameters:
      - { $ref: "#/components/parameters/AdminID" }
    put:
      tags: [Admin]
      summary: 完整更新项目
      operationId: adminUpdateProject
      security: [{ BearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/ProjectInput" }
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }
    delete:
      tags: [Admin]
      summary: 删除项目
      operationId: adminDeleteProject
      security: [{ BearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }

  /api/v1/admin/orders:
    get:
      tags: [Admin]
      summary: 分页读取订单
      operationId: adminListOrders
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [pending_payment, paid, delivered, cancelled] } }
      responses:
        "200": { $ref: "#/components/responses/AdminPageSuccess" }

  /api/v1/admin/orders/{id}/status:
    parameters:
      - { $ref: "#/components/parameters/AdminID" }
    patch:
      tags: [Admin]
      summary: 更新订单状态
      description: 允许待付款→已付款或取消、已付款→已交付；取消待付款订单会恢复库存。
      operationId: adminUpdateOrderStatus
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [paid, delivered, cancelled] }
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: 使用用户名或邮箱登录
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, example: tianhao }
                password: { type: string, format: password }
      responses:
        "200":
          description: 成功时返回 12 小时访问令牌；凭证错误时检查 code
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: success }
                  data:
                    type: object
                    required: [access_token, token_type, expires_in, user]
                    properties:
                      access_token: { type: string }
                      token_type: { type: string, example: Bearer }
                      expires_in: { type: integer, example: 43200 }
                      user: { $ref: "#/components/schemas/User" }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: 读取当前登录用户
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: success }
                  data: { $ref: "#/components/schemas/User" }
        "401":
          description: 无效或缺少访问令牌
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessErrorResponse" }

  /api/v1/projects:
    get:
      tags: [Projects]
      summary: 分页读取已发布项目
      operationId: listProjects
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
      responses:
        "200":
          description: 项目列表
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: success }
                  data:
                    type: object
                    required: [items, total, page, page_size]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Project" }
                      total: { type: integer, format: int64 }
                      page: { type: integer }
                      page_size: { type: integer }

  /api/v1/products:
    get:
      tags: [Store]
      summary: 分页读取在售商品
      operationId: listProducts
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
      responses:
        "200":
          description: 商品列表
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: success }
                  data:
                    type: object
                    required: [items, total, page, page_size]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Product" }
                      total: { type: integer, format: int64 }
                      page: { type: integer }
                      page_size: { type: integer }

  /api/v1/products/{slug}:
    get:
      tags: [Store]
      summary: 读取在售商品详情
      operationId: getProduct
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 商品详情
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: success }
                  data: { $ref: "#/components/schemas/Product" }
        "404":
          description: 商品不存在或未上架
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessErrorResponse" }

  /api/v1/orders:
    post:
      tags: [Store]
      summary: 创建线下付款订单
      description: 下单时原子扣减库存。站长随后通过邮件确认付款与交付；本站不收集银行卡信息。
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
            example: { product_id: 1, email: buyer@example.com, quantity: 1 }
      responses:
        "200":
          description: 成功时返回订单；业务失败时检查 code
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: order created }
                  data: { $ref: "#/components/schemas/Order" }
        "500":
          description: 服务器内部异常
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }

  /api/v1/articles:
    get:
      tags: [Content]
      summary: 分页读取已发布文章
      operationId: listArticles
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
        - in: query
          name: q
          description: 在标题和摘要中搜索
          schema: { type: string }
      responses:
        "200":
          description: 文章列表
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: success }
                  data:
                    type: object
                    required: [items, total, page, page_size]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/ArticleSummary" }
                      total: { type: integer, format: int64 }
                      page: { type: integer }
                      page_size: { type: integer }
        "500":
          description: 服务器内部异常
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }

  /api/v1/articles/{slug}:
    get:
      tags: [Content]
      summary: 按 slug 读取已发布文章
      operationId: getArticle
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 文章详情
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: success }
                  data: { $ref: "#/components/schemas/Article" }
        "404":
          description: 文章不存在或未发布
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessErrorResponse" }

  /api/v1/links:
    get:
      tags: [Content]
      summary: 读取已启用友链
      operationId: listFriendLinks
      responses:
        "200":
          description: 友链列表
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: success }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/FriendLink" }

  /api/v1/health:
    get:
      tags:
        - System

      summary: 服务存活检查

      description: |
        检查 DevHub HTTP 服务进程是否正常运行。

      operationId: healthCheck

      responses:

        "200":
          description: 服务正常运行

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

              example:
                code: 0
                message: success
                data:
                  service: devhub-api
                  status: up


  /api/v1/ready:
    get:
      tags:
        - System

      summary: 服务就绪检查

      description: |
        检查 DevHub 当前依赖是否可用。

        当前阶段主要检查 PostgreSQL。

      operationId: readinessCheck

      responses:

        "200":
          description: 服务已经就绪

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"

              example:
                code: 0
                message: success
                data:
                  postgres: up

        "500":
          description: 服务依赖异常

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"

              example:
                code: 50000
                message: internal server error
                data: null


  /api/v1/auth/register:
    post:
      tags:
        - Auth

      summary: 用户注册

      description: |
        创建新的 DevHub 用户。

        用户名规则：

        - 长度 3~32
        - 仅允许英文字母、数字、下划线
        - 服务端统一转换为小写
        - 用户名不可重复
        - 邮箱不可重复

        密码使用 bcrypt Hash 后保存，
        不会在数据库中保存明文密码。

      operationId: registerUser

      requestBody:
        required: true

        content:
          application/json:

            schema:
              $ref: "#/components/schemas/RegisterRequest"

            examples:

              normal:
                summary: 正常注册
                value:
                  username: tianhao
                  email: tianhao@example.com
                  password: "12345678"

              mixedCase:
                summary: 大小写用户名
                description: 服务端会转换成小写
                value:
                  username: TianHao
                  email: TianHao@example.com
                  password: "12345678"

      responses:

        "200":
          description: |
            HTTP 200 既可能代表业务成功，也可能代表业务失败。

            请根据响应中的 `code` 判断。

          content:
            application/json:

              schema:
                oneOf:
                  - $ref: "#/components/schemas/RegisterSuccessResponse"
                  - $ref: "#/components/schemas/BusinessErrorResponse"

              examples:

                success:
                  summary: 注册成功
                  value:
                    code: 0
                    message: registered successfully
                    data:
                      id: 1
                      username: tianhao
                      email: tianhao@example.com
                      role: 2
                      status: 1
                      created_at: "2026-10-05T17:30:00Z"

                invalidParams:
                  summary: 参数错误
                  value:
                    code: 40001
                    message: invalid request parameters
                    data: null

                invalidUsername:
                  summary: 用户名格式错误
                  value:
                    code: 40002
                    message: username may only contain letters, numbers and underscores
                    data: null

                passwordTooLong:
                  summary: 密码过长
                  value:
                    code: 40003
                    message: password is too long
                    data: null

                usernameExists:
                  summary: 用户名已经存在
                  value:
                    code: 40901
                    message: username already exists
                    data: null

                emailExists:
                  summary: 邮箱已经存在
                  value:
                    code: 40902
                    message: email already exists
                    data: null

        "500":
          description: 服务器内部异常

          content:
            application/json:

              schema:
                $ref: "#/components/schemas/InternalErrorResponse"

              example:
                code: 50000
                message: internal server error
                data: null


components:

  parameters:
    AdminID:
      in: path
      name: id
      required: true
      schema: { type: integer, format: int64, minimum: 1 }

  requestBodies:
    ArticleInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [slug, title, body_md]
            properties:
              slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
              title: { type: string, maxLength: 240 }
              excerpt: { type: string }
              body_md: { type: string }
              cover_url: { type: string }
              tags: { type: array, items: { type: string } }
              status: { type: string, enum: [draft, published], default: draft }
    LinkInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, url]
            properties:
              name: { type: string, maxLength: 100 }
              url: { type: string, format: uri }
              avatar_url: { type: string }
              description: { type: string, maxLength: 280 }
              sort_order: { type: integer }
              enabled: { type: boolean, default: true }
    ProductInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [slug, name, price_cents, stock]
            properties:
              slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
              name: { type: string, maxLength: 240 }
              description: { type: string }
              cover_url: { type: string }
              price_cents: { type: integer, format: int64, minimum: 0 }
              stock: { type: integer, minimum: 0 }
              status: { type: string, enum: [draft, published], default: draft }
    ProjectInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [slug, title]
            properties:
              slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
              title: { type: string, maxLength: 240 }
              description: { type: string }
              cover_url: { type: string, format: uri }
              tags: { type: array, items: { type: string } }
              preview_url: { type: string, format: uri }
              source_url: { type: string, format: uri }
              status: { type: string, enum: [draft, published], default: draft }

  responses:
    AdminSuccess:
      description: 成功时 code 为 0；业务失败时按 code 判断
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BaseResponse" }
    AdminPageSuccess:
      description: 分页列表，data 包含 items、total、page、page_size
      content:
        application/json:
          schema:
            type: object
            required: [code, message, data]
            properties:
              code: { type: integer, example: 0 }
              message: { type: string, example: success }
              data:
                type: object
                required: [items, total, page, page_size]
                properties:
                  items: { type: array, items: { type: object } }
                  total: { type: integer, format: int64 }
                  page: { type: integer }
                  page_size: { type: integer }

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    Project:
      type: object
      required: [id, slug, title, description, cover_url, tags, preview_url, source_url]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        cover_url: { type: string }
        tags:
          type: array
          items: { type: string }
        preview_url: { type: string, description: 隔离来源的预览入口；为空则暂不可预览 }
        source_url: { type: string }

    Product:
      type: object
      required: [id, slug, name, description, cover_url, price_cents, stock]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        cover_url: { type: string }
        price_cents: { type: integer, format: int64, minimum: 0, description: 人民币分 }
        stock: { type: integer, minimum: 0 }

    CreateOrderRequest:
      type: object
      required: [product_id, email, quantity]
      properties:
        product_id: { type: integer, format: int64 }
        email: { type: string, format: email }
        quantity: { type: integer, minimum: 1, maximum: 10 }

    Order:
      type: object
      required: [order_no, product_id, email, quantity, total_cents, status, created_at]
      properties:
        order_no: { type: string }
        product_id: { type: integer, format: int64 }
        email: { type: string, format: email }
        quantity: { type: integer }
        total_cents: { type: integer, format: int64 }
        status: { type: string, enum: [pending_payment, paid, delivered, cancelled] }
        created_at: { type: string, format: date-time }

    ArticleSummary:
      type: object
      required: [id, slug, title, excerpt, cover_url, tags, published_at]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        cover_url: { type: string, format: uri, nullable: true }
        tags:
          type: array
          items: { type: string }
        published_at: { type: string, format: date-time, nullable: true }

    Article:
      allOf:
        - $ref: "#/components/schemas/ArticleSummary"
        - type: object
          required: [body_md, created_at]
          properties:
            body_md: { type: string, description: Markdown 原文 }
            created_at: { type: string, format: date-time }

    FriendLink:
      type: object
      required: [id, name, url, avatar_url, description]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        url: { type: string, format: uri }
        avatar_url: { type: string, format: uri, nullable: true }
        description: { type: string }

    BaseResponse:
      type: object

      required:
        - code
        - message
        - data

      properties:

        code:
          type: integer
          description: |
            DevHub 业务状态码。

            0 表示成功，
            非 0 表示业务失败。
          example: 0

        message:
          type: string
          example: success

        data:
          nullable: true


    HealthData:
      type: object

      required:
        - service
        - status

      properties:

        service:
          type: string
          example: devhub-api

        status:
          type: string
          example: up


    HealthResponse:
      type: object

      required:
        - code
        - message
        - data

      properties:

        code:
          type: integer
          example: 0

        message:
          type: string
          example: success

        data:
          $ref: "#/components/schemas/HealthData"


    ReadyData:
      type: object

      required:
        - postgres

      properties:

        postgres:
          type: string
          example: up


    ReadyResponse:
      type: object

      required:
        - code
        - message
        - data

      properties:

        code:
          type: integer
          example: 0

        message:
          type: string
          example: success

        data:
          $ref: "#/components/schemas/ReadyData"


    RegisterRequest:
      type: object

      required:
        - username
        - email
        - password

      properties:

        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[a-zA-Z0-9_]+$"
          example: tianhao

        email:
          type: string
          format: email
          maxLength: 255
          example: tianhao@example.com

        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
          example: "12345678"


    User:
      type: object

      required:
        - id
        - username
        - email
        - role
        - status
        - created_at

      properties:

        id:
          type: integer
          format: int64
          example: 1

        username:
          type: string
          example: tianhao

        email:
          type: string
          format: email
          example: tianhao@example.com

        role:
          type: integer
          format: int32
          description: |
            用户角色。

            - 1：管理员
            - 2：普通用户
          enum:
            - 1
            - 2
          example: 2

        status:
          type: integer
          format: int32
          description: |
            用户状态。

            - 1：正常
            - 2：禁用
          enum:
            - 1
            - 2
          example: 1

        created_at:
          type: string
          format: date-time
          example: "2026-10-05T17:30:00Z"


    RegisterSuccessResponse:
      type: object

      required:
        - code
        - message
        - data

      properties:

        code:
          type: integer
          enum:
            - 0
          example: 0

        message:
          type: string
          example: registered successfully

        data:
          $ref: "#/components/schemas/User"


    BusinessErrorResponse:
      type: object

      required:
        - code
        - message
        - data

      properties:

        code:
          type: integer
          description: 业务错误码
          example: 40901

        message:
          type: string
          example: username already exists

        data:
          nullable: true
          example: null


    InternalErrorResponse:
      type: object

      required:
        - code
        - message
        - data

      properties:

        code:
          type: integer
          enum:
            - 50000
          example: 50000

        message:
          type: string
          example: internal server error

        data:
          nullable: true
          example: null
