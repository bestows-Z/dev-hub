openapi: 3.0.3

info:
  title: DevHub API
  description: |
    DevHub 个人开发者平台后端 API。

    ## 统一响应约定

    除真正的服务器内部异常外，HTTP Status 统一返回 200。

    客户端通过响应体中的 `code` 判断业务执行结果。

    - `code = 0`：成功
    - `code != 0`：业务失败
    - HTTP 500：服务器内部异常

  version: 0.2.0

servers:
  - url: http://localhost:8080
    description: 本地开发环境

tags:
  - name: System
    description: 系统基础接口

  - name: Auth
    description: 用户认证接口

  - name: Content
    description: 公开文章与友链

  - name: Store
    description: 商品和订单

  - name: Projects
    description: 公开项目

  - name: Admin
    description: 管理员内容与订单维护；先通过登录接口获取 Bearer Token

  - name: Assistant
    description: 基于已发布文章的问答；可选接入兼容 Chat Completions 的模型

  - name: Engagement
    description: 文章评论与友链申请；提交需要登录并经管理员审核


paths:

  /api/v1/admin/analytics:
    get:
      tags: [Admin]
      summary: 最近七天匿名页面访问统计
      description: 仅统计成功打开的文章、商品详情和本站项目预览；通过 RabbitMQ 异步写入 MongoDB，不记录访客 IP。按北京时间分日，记录保留 180 天。
      operationId: adminAnalytics
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: 当 MongoDB 不可用时返回非零业务错误码
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: success }
                  data:
                    type: object
                    properties:
                      today: { type: integer, example: 12 }
                      last_7_days: { type: integer, example: 86 }
                      daily:
                        type: array
                        items:
                          type: object
                          properties:
                            day: { type: string, format: date }
                            count: { type: integer }
                      top_pages:
                        type: array
                        items:
                          type: object
                          properties:
                            kind: { type: string, enum: [article, product, project] }
                            slug: { type: string }
                            count: { type: integer }

  /api/v1/assistant/chat:
    post:
      tags: [Assistant]
      summary: 向文章助手提问
      description: 仅检索已发布文章。未配置模型时返回相关原文摘录，配置模型后根据摘录生成回答；始终附来源。单 IP 每分钟最多 20 次。
      operationId: assistantChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, minLength: 2, maxLength: 500, example: 数据库库存是怎么更新的？ }
      responses:
        "200":
          description: code 为 0 时成功；无结果时返回提示与空来源列表
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: success }
                  data:
                    type: object
                    required: [answer, sources]
                    properties:
                      answer: { type: string }
                      sources:
                        type: array
                        items:
                          type: object
                          required: [title, url]
                          properties:
                            title: { type: string }
                            url: { type: string, example: /articles/postgres-notes }

  /api/v1/admin/comments:
    get:
      tags: [Admin]
      summary: 分页读取待审或已审评论
      operationId: adminListComments
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/AdminSearch" }
        - { in: query, name: status, schema: { type: string, enum: [pending, approved, rejected], default: pending } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200": { $ref: "#/components/responses/AdminPageSuccess" }
  /api/v1/admin/comments/{id}:
    patch:
      tags: [Admin]
      summary: 审核评论
      operationId: adminReviewComment
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [approved, rejected] }
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }
  /api/v1/admin/link-applications:
    get:
      tags: [Admin]
      summary: 分页读取友链申请
      operationId: adminListLinkApplications
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/AdminSearch" }
        - { in: query, name: status, schema: { type: string, enum: [pending, approved, rejected], default: pending } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200": { $ref: "#/components/responses/AdminPageSuccess" }
  /api/v1/admin/link-applications/{id}:
    patch:
      tags: [Admin]
      summary: 审核友链申请；通过后自动创建公开友链
      operationId: adminReviewLinkApplication
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [approved, rejected] }
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }

  /api/v1/admin/articles:
    get:
      tags: [Admin]
      summary: 管理员读取全部文章（含草稿）
      operationId: adminListArticles
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/AdminSearch" }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200": { $ref: "#/components/responses/AdminPageSuccess" }
    post:
      tags: [Admin]
      summary: 创建文章
      operationId: adminCreateArticle
      security: [{ BearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/ArticleInput" }
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }

  /api/v1/admin/articles/{id}:
    parameters:
      - { $ref: "#/components/parameters/AdminID" }
    put:
      tags: [Admin]
      summary: 完整更新文章
      operationId: adminUpdateArticle
      security: [{ BearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/ArticleInput" }
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }
    delete:
      tags: [Admin]
      summary: 删除文章
      operationId: adminDeleteArticle
      security: [{ BearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }

  /api/v1/admin/links:
    get:
      tags: [Admin]
      summary: 管理员读取全部友链
      operationId: adminListLinks
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/AdminSearch" }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200": { $ref: "#/components/responses/AdminPageSuccess" }
    post:
      tags: [Admin]
      summary: 创建友链
      operationId: adminCreateLink
      security: [{ BearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/LinkInput" }
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }

  /api/v1/admin/links/{id}:
    parameters:
      - { $ref: "#/components/parameters/AdminID" }
    put:
      tags: [Admin]
      summary: 完整更新友链
      operationId: adminUpdateLink
      security: [{ BearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/LinkInput" }
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }
    delete:
      tags: [Admin]
      summary: 删除友链
      operationId: adminDeleteLink
      security: [{ BearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }

  /api/v1/admin/products:
    get:
      tags: [Admin]
      summary: 管理员读取全部商品
      operationId: adminListProducts
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/AdminSearch" }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200": { $ref: "#/components/responses/AdminPageSuccess" }
    post:
      tags: [Admin]
      summary: 创建商品
      operationId: adminCreateProduct
      security: [{ BearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/ProductInput" }
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }

  /api/v1/admin/products/{id}:
    parameters:
      - { $ref: "#/components/parameters/AdminID" }
    put:
      tags: [Admin]
      summary: 完整更新商品
      operationId: adminUpdateProduct
      security: [{ BearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/ProductInput" }
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }
    delete:
      tags: [Admin]
      summary: 删除商品；有订单引用时不能删除
      operationId: adminDeleteProduct
      security: [{ BearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }

  /api/v1/admin/projects:
    get:
      tags: [Admin]
      summary: 管理员读取全部项目
      operationId: adminListProjects
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/AdminSearch" }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200": { $ref: "#/components/responses/AdminPageSuccess" }
    post:
      tags: [Admin]
      summary: 创建项目
      operationId: adminCreateProject
      security: [{ BearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/ProjectInput" }
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }

  /api/v1/admin/projects/{id}:
    parameters:
      - { $ref: "#/components/parameters/AdminID" }
    put:
      tags: [Admin]
      summary: 完整更新项目
      operationId: adminUpdateProject
      security: [{ BearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/ProjectInput" }
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }
    delete:
      tags: [Admin]
      summary: 删除项目
      operationId: adminDeleteProject
      security: [{ BearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }

  /api/v1/admin/projects/{id}/bundle:
    parameters:
      - { $ref: "#/components/parameters/AdminID" }
    post:
      tags: [Admin]
      summary: 上传静态站点 ZIP 到 MinIO
      description: ZIP 必须包含 index.html，可位于单层构建目录中。仅允许网页资源类型；压缩包不超过 20 MiB，单文件解压不超过 10 MiB，总解压不超过 100 MiB。项目发布后可访问预览 URL。重新上传会替换旧版本。
      operationId: adminUploadProjectBundle
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 静态站点 ZIP }
      responses:
        "200":
          description: code 为 0 时上传成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: success }
                  data:
                    type: object
                    properties:
                      preview_url: { type: string, example: /api/v1/project-previews/my-project/index.html }
                      files: { type: integer, example: 12 }

  /api/v1/admin/projects/{id}/runtime-bundle:
    parameters:
      - { $ref: "#/components/parameters/AdminID" }
    post:
      tags: [Admin]
      summary: 上传完整前后端项目 ZIP
      description: ZIP 根目录必须包含 docker-compose.yml、frontend/Dockerfile、backend/Dockerfile；Compose 仅接受 frontend 与 backend 两个服务，对应 ./frontend 和 ./backend。ZIP 不超过 50 MiB，解压总量不超过 250 MiB。上传只保存到 MinIO，不会在 API 进程构建或运行。站长在服务器执行 deploy-zip 命令后，已发布项目可在本站预览。模板可从 /downloads/project-runtime-template.zip 下载。
      operationId: adminUploadRuntimeBundle
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 完整前后端项目 ZIP }
      responses:
        "200":
          description: code 为 0 时上传成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: success }
                  data:
                    type: object
                    properties:
                      uploaded: { type: boolean, example: true }
                      runtime_status: { type: string, enum: [stopped, running] }

  /api/v1/project-previews/{slug}/{filepath}:
    get:
      tags: [Projects]
      summary: 读取公开项目的静态预览资源
      description: 返回原始 HTML、JS、CSS 或图片内容。预览 HTML 带 CSP sandbox；建议在 iframe 中再设置 sandbox。路径仅可访问已发布项目 ZIP 中的资源。
      operationId: getProjectPreviewFile
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
        - { in: path, name: filepath, required: true, schema: { type: string }, description: 相对文件路径，可含斜线 }
      responses:
        "200":
          description: 静态预览文件，Content-Type 随文件类型变化
          content:
            text/html: { schema: { type: string } }
            application/javascript: { schema: { type: string } }
            text/css: { schema: { type: string } }
        "404": { description: 项目未发布或文件不存在 }

  /api/v1/project-runtimes/{slug}/:
    get:
      tags: [Projects]
      summary: 打开已发布项目的前端首页
      operationId: getProjectRuntimeHome
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
      responses:
        "200": { description: 项目前端响应 }
        "404": { description: 项目未发布或未运行 }
        "502": { description: 项目服务暂时不可用 }

  /api/v1/project-runtimes/{slug}/{filepath}:
    get:
      tags: [Projects]
      summary: 转发公开项目的前端或后端服务
      description: >-
        `/api/v1/project-runtimes/{slug}/` 连接前端；`/api/v1/project-runtimes/{slug}/backend/` 连接后端。仅公开已发布、运行中的项目。实际支持常规 HTTP 方法，此处用 GET 展示入口；首版不支持 WebSocket 升级。响应是项目自身内容，不使用 DevHub 的 code/message/data 包装。
      operationId: getProjectRuntime
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
        - { in: path, name: filepath, required: true, schema: { type: string }, description: 前端相对路径；以 backend/ 开头时转给后端 }
      responses:
        "200": { description: 项目服务返回的内容 }
        "404": { description: 项目未发布或未运行 }
        "502": { description: 项目服务暂时不可用 }
    post:
      tags: [Projects]
      summary: 向项目后端发送 POST 请求
      operationId: postProjectRuntime
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
        - { in: path, name: filepath, required: true, schema: { type: string }, description: 以 backend/ 开头的后端相对路径 }
      requestBody:
        content:
          application/json: { schema: {} }
      responses:
        "200": { description: 项目后端响应，状态码由项目决定 }
        "404": { description: 项目未发布或未运行 }
    put:
      tags: [Projects]
      summary: 向项目后端发送 PUT 请求
      operationId: putProjectRuntime
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
        - { in: path, name: filepath, required: true, schema: { type: string }, description: 以 backend/ 开头的后端相对路径 }
      requestBody:
        content:
          application/json: { schema: {} }
      responses:
        "200": { description: 项目后端响应，状态码由项目决定 }
        "404": { description: 项目未发布或未运行 }
    patch:
      tags: [Projects]
      summary: 向项目后端发送 PATCH 请求
      operationId: patchProjectRuntime
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
        - { in: path, name: filepath, required: true, schema: { type: string }, description: 以 backend/ 开头的后端相对路径 }
      requestBody:
        content:
          application/json: { schema: {} }
      responses:
        "200": { description: 项目后端响应，状态码由项目决定 }
        "404": { description: 项目未发布或未运行 }
    delete:
      tags: [Projects]
      summary: 向项目后端发送 DELETE 请求
      operationId: deleteProjectRuntime
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
        - { in: path, name: filepath, required: true, schema: { type: string }, description: 以 backend/ 开头的后端相对路径 }
      responses:
        "200": { description: 项目后端响应，状态码由项目决定 }
        "404": { description: 项目未发布或未运行 }

  /api/v1/admin/orders:
    get:
      tags: [Admin]
      summary: 分页读取订单
      operationId: adminListOrders
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/AdminSearch" }
        - { in: query, name: status, schema: { type: string, enum: [pending_payment, paid, delivered, cancelled] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200": { $ref: "#/components/responses/AdminPageSuccess" }

  /api/v1/admin/orders/{id}/status:
    parameters:
      - { $ref: "#/components/parameters/AdminID" }
    patch:
      tags: [Admin]
      summary: 更新订单状态
      description: 允许待付款→已付款或取消、已付款→已交付；取消待付款订单会恢复库存。
      operationId: adminUpdateOrderStatus
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [paid, delivered, cancelled] }
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: 使用用户名或邮箱登录
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, example: tianhao }
                password: { type: string, format: password }
      responses:
        "200":
          description: 成功时返回 12 小时访问令牌；凭证错误时检查 code
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: success }
                  data:
                    type: object
                    required: [access_token, token_type, expires_in, user]
                    properties:
                      access_token: { type: string }
                      token_type: { type: string, example: Bearer }
                      expires_in: { type: integer, example: 43200 }
                      user: { $ref: "#/components/schemas/User" }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: 读取当前登录用户
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: success }
                  data: { $ref: "#/components/schemas/User" }
        "401":
          description: 无效或缺少访问令牌
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessErrorResponse" }
    put:
      tags: [Auth]
      summary: 更新当前用户资料
      description: 邮箱可用于后续登录；用户名、角色和状态不可在此修改。个人资料仅由本人读取。
      operationId: updateCurrentUser
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 255 }
                display_name: { type: string, maxLength: 60 }
                bio: { type: string, maxLength: 500 }
                website_url: { type: string, maxLength: 255, description: 为空或以 http/https 开头的完整网址 }
      responses:
        "200": { $ref: "#/components/responses/UserSuccess" }
        "401": { $ref: "#/components/responses/AuthRequired" }

  /api/v1/auth/me/avatar:
    post:
      tags: [Auth]
      summary: 上传并替换本人头像
      description: 仅接收不超过 2 MiB 的 PNG/JPEG，图像最长边不超过 2048 像素；服务端重新编码为 PNG 并去掉元数据。
      operationId: uploadCurrentUserAvatar
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200": { $ref: "#/components/responses/UserSuccess" }
        "401": { $ref: "#/components/responses/AuthRequired" }
    delete:
      tags: [Auth]
      summary: 移除本人头像
      operationId: deleteCurrentUserAvatar
      security: [{ BearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/UserSuccess" }
        "401": { $ref: "#/components/responses/AuthRequired" }

  /api/v1/avatars/{id}:
    get:
      tags: [Auth]
      summary: 读取用户公开头像
      operationId: getUserAvatar
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: PNG 图片内容
          content:
            image/png:
              schema: { type: string, format: binary }
        "404": { description: 头像不存在 }

  /api/v1/projects:
    get:
      tags: [Projects]
      summary: 分页读取已发布项目
      operationId: listProjects
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
      responses:
        "200":
          description: 项目列表
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: success }
                  data:
                    type: object
                    required: [items, total, page, page_size]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Project" }
                      total: { type: integer, format: int64 }
                      page: { type: integer }
                      page_size: { type: integer }

  /api/v1/products:
    get:
      tags: [Store]
      summary: 分页读取在售商品
      operationId: listProducts
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
      responses:
        "200":
          description: 商品列表
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: success }
                  data:
                    type: object
                    required: [items, total, page, page_size]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Product" }
                      total: { type: integer, format: int64 }
                      page: { type: integer }
                      page_size: { type: integer }

  /api/v1/products/{slug}:
    get:
      tags: [Store]
      summary: 读取在售商品详情
      operationId: getProduct
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 商品详情
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: success }
                  data: { $ref: "#/components/schemas/Product" }
        "404":
          description: 商品不存在或未上架
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessErrorResponse" }

  /api/v1/orders:
    post:
      tags: [Store]
      summary: 创建线下付款订单
      description: 下单时原子扣减库存。站长随后通过邮件确认付款与交付；本站不收集银行卡信息。
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
            example: { product_id: 1, email: buyer@example.com, quantity: 1 }
      responses:
        "200":
          description: 成功时返回订单；业务失败时检查 code
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: order created }
                  data: { $ref: "#/components/schemas/Order" }
        "500":
          description: 服务器内部异常
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }

  /api/v1/articles:
    get:
      tags: [Content]
      summary: 分页读取已发布文章
      operationId: listArticles
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
        - in: query
          name: q
          description: 在标题、摘要和 Markdown 正文中搜索
          schema: { type: string }
        - in: query
          name: category
          description: 文章栏目；留空为全部
          schema: { type: string, enum: [tech, travel, essay, record] }
        - in: query
          name: tag
          description: 精确匹配标签；留空为全部
          schema: { type: string, maxLength: 40 }
      responses:
        "200":
          description: 文章列表
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: success }
                  data:
                    type: object
                    required: [items, total, page, page_size]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/ArticleSummary" }
                      total: { type: integer, format: int64 }
                      page: { type: integer }
                      page_size: { type: integer }
        "500":
          description: 服务器内部异常
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }

  /api/v1/articles/facets:
    get:
      tags: [Content]
      summary: 已发布文章的栏目与标签数量
      operationId: articleFacets
      responses:
        "200":
          description: 栏目与标签统计
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: success }
                  data:
                    type: object
                    required: [categories, tags]
                    properties:
                      categories:
                        type: array
                        items: { $ref: "#/components/schemas/ArticleFacet" }
                      tags:
                        type: array
                        items: { $ref: "#/components/schemas/ArticleFacet" }

  /api/v1/articles/{slug}:
    get:
      tags: [Content]
      summary: 按 slug 读取已发布文章
      operationId: getArticle
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 文章详情
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: success }
                  data: { $ref: "#/components/schemas/Article" }
        "404":
          description: 文章不存在或未发布
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessErrorResponse" }

  /api/v1/articles/{slug}/comments:
    parameters:
      - { in: path, name: slug, required: true, schema: { type: string } }
    get:
      tags: [Engagement]
      summary: 读取已审核的文章评论
      operationId: listArticleComments
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: 每页最多 20 条公开评论
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/ArticleComment" } }
                      total: { type: integer, format: int64 }
                      page: { type: integer }
                      page_size: { type: integer, example: 20 }
    post:
      tags: [Engagement]
      summary: 登录读者提交评论，等待审核
      description: 同一用户每 30 秒最多提交一条评论；超出时业务 code 为 42901。
      operationId: createArticleComment
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }
        "401": { description: 未登录或访问令牌失效 }

  /api/v1/links:
    get:
      tags: [Content]
      summary: 读取已启用友链
      operationId: listFriendLinks
      responses:
        "200":
          description: 友链列表
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: success }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/FriendLink" }

  /api/v1/link-applications:
    post:
      tags: [Engagement]
      summary: 登录读者申请友链，等待审核
      description: 每个用户同时只能有一条待审申请；重复提交时业务 code 为 40901。
      operationId: applyFriendLink
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties:
                name: { type: string, maxLength: 100 }
                url: { type: string, format: uri }
                avatar_url: { type: string, format: uri }
                description: { type: string, maxLength: 280 }
      responses:
        "200": { $ref: "#/components/responses/AdminSuccess" }
        "401": { description: 未登录或访问令牌失效 }

  /api/v1/health:
    get:
      tags:
        - System

      summary: 服务存活检查

      description: |
        检查 DevHub HTTP 服务进程是否正常运行。

      operationId: healthCheck

      responses:

        "200":
          description: 服务正常运行

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

              example:
                code: 0
                message: success
                data:
                  service: devhub-api
                  status: up


  /api/v1/ready:
    get:
      tags:
        - System

      summary: 服务就绪检查

      description: |
        检查 DevHub 当前依赖是否可用。

        当前阶段主要检查 PostgreSQL。

      operationId: readinessCheck

      responses:

        "200":
          description: 服务已经就绪

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"

              example:
                code: 0
                message: success
                data:
                  postgres: up

        "500":
          description: 服务依赖异常

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"

              example:
                code: 50000
                message: internal server error
                data: null


  /api/v1/auth/register:
    post:
      tags:
        - Auth

      summary: 用户注册

      description: |
        创建新的 DevHub 用户。

        用户名规则：

        - 长度 3~32
        - 仅允许英文字母、数字、下划线
        - 服务端统一转换为小写
        - 用户名不可重复
        - 邮箱不可重复

        密码使用 bcrypt Hash 后保存，
        不会在数据库中保存明文密码。

      operationId: registerUser

      requestBody:
        required: true

        content:
          application/json:

            schema:
              $ref: "#/components/schemas/RegisterRequest"

            examples:

              normal:
                summary: 正常注册
                value:
                  username: tianhao
                  email: tianhao@example.com
                  password: "12345678"

              mixedCase:
                summary: 大小写用户名
                description: 服务端会转换成小写
                value:
                  username: TianHao
                  email: TianHao@example.com
                  password: "12345678"

      responses:

        "200":
          description: |
            HTTP 200 既可能代表业务成功，也可能代表业务失败。

            请根据响应中的 `code` 判断。

          content:
            application/json:

              schema:
                oneOf:
                  - $ref: "#/components/schemas/RegisterSuccessResponse"
                  - $ref: "#/components/schemas/BusinessErrorResponse"

              examples:

                success:
                  summary: 注册成功
                  value:
                    code: 0
                    message: registered successfully
                    data:
                      id: 1
                      username: tianhao
                      email: tianhao@example.com
                      role: 2
                      status: 1
                      created_at: "2026-10-05T17:30:00Z"

                invalidParams:
                  summary: 参数错误
                  value:
                    code: 40001
                    message: invalid request parameters
                    data: null

                invalidUsername:
                  summary: 用户名格式错误
                  value:
                    code: 40002
                    message: username may only contain letters, numbers and underscores
                    data: null

                passwordTooLong:
                  summary: 密码过长
                  value:
                    code: 40003
                    message: password is too long
                    data: null

                usernameExists:
                  summary: 用户名已经存在
                  value:
                    code: 40901
                    message: username already exists
                    data: null

                emailExists:
                  summary: 邮箱已经存在
                  value:
                    code: 40902
                    message: email already exists
                    data: null

        "500":
          description: 服务器内部异常

          content:
            application/json:

              schema:
                $ref: "#/components/schemas/InternalErrorResponse"

              example:
                code: 50000
                message: internal server error
                data: null


components:

  parameters:
    AdminSearch:
      in: query
      name: q
      description: 跨全部记录搜索标题、名称、标识、评论内容或联系信息，最多读取 100 个字符
      schema: { type: string, maxLength: 100 }
    AdminID:
      in: path
      name: id
      required: true
      schema: { type: integer, format: int64, minimum: 1 }

  requestBodies:
    ArticleInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [slug, title, body_md]
            properties:
              slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
              title: { type: string, maxLength: 240 }
              excerpt: { type: string }
              body_md: { type: string }
              cover_url: { type: string }
              category: { type: string, enum: [tech, travel, essay, record], default: tech }
              tags: { type: array, items: { type: string } }
              status: { type: string, enum: [draft, published], default: draft }
    LinkInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, url]
            properties:
              name: { type: string, maxLength: 100 }
              url: { type: string, format: uri }
              avatar_url: { type: string }
              description: { type: string, maxLength: 280 }
              sort_order: { type: integer }
              enabled: { type: boolean, default: true }
    ProductInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [slug, name, price_cents, stock]
            properties:
              slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
              name: { type: string, maxLength: 240 }
              description: { type: string }
              cover_url: { type: string }
              price_cents: { type: integer, format: int64, minimum: 0 }
              stock: { type: integer, minimum: 0 }
              status: { type: string, enum: [draft, published], default: draft }
    ProjectInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [slug, title]
            properties:
              slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
              title: { type: string, maxLength: 240 }
              description: { type: string }
              cover_url: { type: string, format: uri }
              tags: { type: array, items: { type: string } }
              preview_url: { type: string, description: 可填外部 HTTP(S) 地址；上传站点后由服务器生成站内路径 }
              source_url: { type: string, format: uri }
              status: { type: string, enum: [draft, published], default: draft }

  responses:
    UserSuccess:
      description: 当前用户资料
      content:
        application/json:
          schema:
            type: object
            required: [code, message, data]
            properties:
              code: { type: integer, example: 0 }
              message: { type: string, example: success }
              data: { $ref: "#/components/schemas/User" }
    AuthRequired:
      description: 缺少或无效的访问令牌
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BusinessErrorResponse" }
    AdminSuccess:
      description: 成功时 code 为 0；业务失败时按 code 判断
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BaseResponse" }
    AdminPageSuccess:
      description: 分页列表，data 包含 items、total、page、page_size
      content:
        application/json:
          schema:
            type: object
            required: [code, message, data]
            properties:
              code: { type: integer, example: 0 }
              message: { type: string, example: success }
              data:
                type: object
                required: [items, total, page, page_size]
                properties:
                  items: { type: array, items: { type: object } }
                  total: { type: integer, format: int64 }
                  page: { type: integer }
                  page_size: { type: integer }

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    Project:
      type: object
      required: [id, slug, title, description, cover_url, tags, preview_url, backend_url, runtime_bundle_uploaded, runtime_status, source_url]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        cover_url: { type: string }
        tags:
          type: array
          items: { type: string }
        preview_url: { type: string, description: 隔离来源的预览入口；为空则暂不可预览 }
        backend_url: { type: string, description: 运行中的项目后端入口，否则为空 }
        runtime_bundle_uploaded: { type: boolean, description: 是否已上传完整前后端 ZIP }
        runtime_status: { type: string, enum: [stopped, running] }
        source_url: { type: string }

    Product:
      type: object
      required: [id, slug, name, description, cover_url, price_cents, stock]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        cover_url: { type: string }
        price_cents: { type: integer, format: int64, minimum: 0, description: 人民币分 }
        stock: { type: integer, minimum: 0 }

    CreateOrderRequest:
      type: object
      required: [product_id, email, quantity]
      properties:
        product_id: { type: integer, format: int64 }
        email: { type: string, format: email }
        quantity: { type: integer, minimum: 1, maximum: 10 }

    Order:
      type: object
      required: [order_no, product_id, email, quantity, total_cents, status, created_at]
      properties:
        order_no: { type: string }
        product_id: { type: integer, format: int64 }
        email: { type: string, format: email }
        quantity: { type: integer }
        total_cents: { type: integer, format: int64 }
        status: { type: string, enum: [pending_payment, paid, delivered, cancelled] }
        created_at: { type: string, format: date-time }

    ArticleComment:
      type: object
      required: [id, body, username, created_at]
      properties:
        id: { type: integer, format: int64 }
        body: { type: string }
        username: { type: string }
        created_at: { type: string, format: date-time }

    ArticleFacet:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: integer, format: int64 }

    ArticleSummary:
      type: object
      required: [id, slug, title, excerpt, cover_url, category, tags, published_at]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        cover_url: { type: string, format: uri, nullable: true }
        category: { type: string, enum: [tech, travel, essay, record] }
        tags:
          type: array
          items: { type: string }
        published_at: { type: string, format: date-time, nullable: true }

    Article:
      allOf:
        - $ref: "#/components/schemas/ArticleSummary"
        - type: object
          required: [body_md, created_at]
          properties:
            body_md: { type: string, description: Markdown 原文 }
            created_at: { type: string, format: date-time }

    FriendLink:
      type: object
      required: [id, name, url, avatar_url, description]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        url: { type: string, format: uri }
        avatar_url: { type: string, format: uri, nullable: true }
        description: { type: string }

    BaseResponse:
      type: object

      required:
        - code
        - message
        - data

      properties:

        code:
          type: integer
          description: |
            DevHub 业务状态码。

            0 表示成功，
            非 0 表示业务失败。
          example: 0

        message:
          type: string
          example: success

        data:
          nullable: true


    HealthData:
      type: object

      required:
        - service
        - status

      properties:

        service:
          type: string
          example: devhub-api

        status:
          type: string
          example: up


    HealthResponse:
      type: object

      required:
        - code
        - message
        - data

      properties:

        code:
          type: integer
          example: 0

        message:
          type: string
          example: success

        data:
          $ref: "#/components/schemas/HealthData"


    ReadyData:
      type: object

      required:
        - postgres

      properties:

        postgres:
          type: string
          example: up


    ReadyResponse:
      type: object

      required:
        - code
        - message
        - data

      properties:

        code:
          type: integer
          example: 0

        message:
          type: string
          example: success

        data:
          $ref: "#/components/schemas/ReadyData"


    RegisterRequest:
      type: object

      required:
        - username
        - email
        - password

      properties:

        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[a-zA-Z0-9_]+$"
          example: tianhao

        email:
          type: string
          format: email
          maxLength: 255
          example: tianhao@example.com

        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
          example: "12345678"


    User:
      type: object

      required:
        - id
        - username
        - email
        - display_name
        - bio
        - website_url
        - avatar_url
        - role
        - status
        - created_at

      properties:

        id:
          type: integer
          format: int64
          example: 1

        username:
          type: string
          example: tianhao

        email:
          type: string
          format: email
          example: tianhao@example.com

        display_name: { type: string, example: 天昊 }
        bio: { type: string, example: 写代码，也记生活。 }
        website_url: { type: string, example: "https://example.com" }
        avatar_url: { type: string, description: 空字符串或本站头像相对路径 }

        role:
          type: integer
          format: int32
          description: |
            用户角色。

            - 1：管理员
            - 2：普通用户
          enum:
            - 1
            - 2
          example: 2

        status:
          type: integer
          format: int32
          description: |
            用户状态。

            - 1：正常
            - 2：禁用
          enum:
            - 1
            - 2
          example: 1

        created_at:
          type: string
          format: date-time
          example: "2026-10-05T17:30:00Z"


    RegisterSuccessResponse:
      type: object

      required:
        - code
        - message
        - data

      properties:

        code:
          type: integer
          enum:
            - 0
          example: 0

        message:
          type: string
          example: registered successfully

        data:
          $ref: "#/components/schemas/User"


    BusinessErrorResponse:
      type: object

      required:
        - code
        - message
        - data

      properties:

        code:
          type: integer
          description: 业务错误码
          example: 40901

        message:
          type: string
          example: username already exists

        data:
          nullable: true
          example: null


    InternalErrorResponse:
      type: object

      required:
        - code
        - message
        - data

      properties:

        code:
          type: integer
          enum:
            - 50000
          example: 50000

        message:
          type: string
          example: internal server error

        data:
          nullable: true
          example: null
